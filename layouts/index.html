{{- $p := .Site.Params -}}<!doctype html>
<html lang="zh-CN" data-cv-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>刘宇轩 Yuxuan Liu · 简历</title>
<meta name="description" content="清华大学计算机科学与技术 / 经济与金融双学位本科生。研究方向：LLMs 高效推理、智能体记忆与自进化。" />
<link rel="icon" href="{{ "favicon.ico" | relURL }}" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Mulish:wght@400;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="{{ "css/cv.css" | relURL }}" />
<script>
  (function () {
    try {
      var m = localStorage.getItem("cv_theme");
      if (!m || m === "auto") {
        m = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-cv-theme", m);
    } catch (e) {}
    /* 仅在 JS 可用时启用入场动画：JS 失效则内容直接完整可见 */
    document.documentElement.classList.add("js");
  })();
</script>
</head>
<body>
<a class="skip-link" href="#main">跳到正文</a>
<div class="cv-page">
{{- partial "cv/rail.html" . -}}
<main class="cv-main" id="main">
{{- partial "cv/body.html" . -}}
</main>
</div>
<script src="{{ "js/cv.js" | relURL }}" defer></script>
{{- if $p.firework.enable -}}
<script>
  var setupFirework = function () {
    if (window.firework) {
      window.firework({
        excludeElements: ["a", "button"],
        particles: [
          { shape: "circle", move: ["emit"], easing: "easeOutExpo", colors: ["var(--ac)", "var(--ac-2)", "var(--ac-3)", "var(--ac-4)"], number: 20, duration: [1200, 1800], shapeOptions: { radius: [16, 32], alpha: [0.3, 0.5] } },
          { shape: "circle", move: ["diffuse"], easing: "easeOutExpo", colors: ["var(--ac)"], number: 1, duration: [1200, 1800], shapeOptions: { radius: 20, alpha: [0.2, 0.5], lineWidth: 6 } }
        ]
      });
    }
  };
</script>
<script src="https://npm.webcache.cn/mouse-firework@0.2.0/dist/index.umd.js" integrity="sha384-qi9WggRt19tv8Vc7pCHW3ulMNLwrn515zaLEWZjl1px07vz8+pUoWX8n1rgq282T" crossorigin="anonymous" referrerpolicy="no-referrer" defer onload="setupFirework()"></script>
{{- end -}}
</body>
</html>
